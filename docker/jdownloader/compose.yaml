services:
  jdownloader:
    container_name: jdownloader
    image: docker.io/jlesage/jdownloader-2:latest
    ports:
      - "${JDOWNLOADER_HOST:?Set the NAS LAN IP}:${JDOWNLOADER_PORT:-5800}:5800"
    environment:
      USER_ID: "${JDOWNLOADER_USER_ID:?Set the DSM user ID}"
      GROUP_ID: "${JDOWNLOADER_GROUP_ID:?Set the DSM group ID}"
      SUP_GROUP_IDS: "${ADMINISTRATORS_GID}"
    volumes:
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${JDOWNLOADER_CONFIG_PATH:?Set the configuration folder}
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ${JDOWNLOADER_DOWNLOAD_PATH:?Set the download folder}
        target: /output
        bind:
          create_host_path: false
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: jdownloader-jdownloader
