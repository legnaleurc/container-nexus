services:
  dfd:
    container_name: dfd
    image: docker.io/library/nginx:stable-alpine-slim
    ports:
      - "${DFD_HOST}:${DFD_PORT}:80"
    environment:
      DULD_API_URL: "${DULD_API_URL}"
    volumes:
      - type: bind
        source: ./index.html
        target: /usr/share/nginx/html/index.html
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx.conf.template
        target: /etc/nginx/templates/default.conf.template
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: dfd-dfd
